name: Deployer le site (sans scraper)

# Redeploie GitHub Pages a partir du contenu deja commite dans site/, sans relancer
# les scrapers -- utile apres une modification manuelle de site/index.html (design,
# contenu statique) qui n'attend pas le prochain run daily/weekly pour etre visible.

on:
  workflow_dispatch: {}

permissions:
  pages: write
  id-token: write

concurrency:
  group: antenne-benin-pipeline
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url || steps.deployment3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      # L'artefact n'est pas toujours visible de l'API juste apres son envoi ("No artifacts
      # named github-pages", 23 et 24/11/2026) : on attend, puis on retente deux fois.
      - run: sleep 20

      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        run: sleep 120

      - id: deployment3
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@v5
